<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EZRA Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --p:#4318D1; --p2:#6b4df0; --p3:#ede7ff;
  --green:#2e7d32; --green2:#4CAF50; --green3:#e8f5e9;
  --red:#c62828; --red2:#ef5350; --red3:#ffebee;
  --orange:#e65100; --orange3:#fff3e0;
  --bg:#F4F2FF; --card:#fff; --text:#1a1033; --muted:#888;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Sora',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; flex-direction:column; align-items:center; }

header { width:100%; background:linear-gradient(110deg,#2d0f8f,#4318D1 60%,#7c3aed);
  color:#fff; padding:0 28px; height:60px; display:flex; align-items:center; gap:14px;
  box-shadow:0 2px 16px rgba(67,24,209,.3); }
.logo { width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.15);
  border:2px solid rgba(255,255,255,.4); display:grid; place-items:center;
  font-size:16px; font-weight:800; }
header h1 { font-size:20px; font-weight:800; }
header p  { font-size:11px; opacity:.7; margin-top:1px; }

.progress-wrap { width:100%; max-width:640px; padding:18px 0 0; }
.progress-track { background:#ddd; border-radius:20px; height:6px; }
.progress-fill  { background:linear-gradient(90deg,var(--p),var(--p2));
  height:6px; border-radius:20px; transition:width .5s; }
.progress-label { font-size:12px; color:var(--muted); text-align:right;
  margin-bottom:6px; font-weight:600; }

.card { background:var(--card); border-radius:20px; padding:28px 30px;
  box-shadow:0 6px 28px rgba(67,24,209,.10); width:100%; max-width:640px;
  margin-top:18px; border:1px solid rgba(67,24,209,.07); }

.hebrew-label { font-size:11px; color:var(--muted); font-weight:700;
  text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
.hebrew-text { background:#f5f0ff; border-left:4px solid #a78bfa;
  padding:12px 16px; border-radius:10px; font-size:22px;
  direction:rtl; text-align:right; color:#4a0080;
  line-height:1.5; margin-bottom:20px; }

.english-ref { font-size:16px; color:var(--muted); margin-bottom:16px;
  min-height:22px; transition:opacity .3s; }

.btn { padding:11px 22px; border:none; border-radius:12px; font-size:15px;
  font-weight:700; cursor:pointer; transition:.18s; font-family:inherit;
  display:inline-flex; align-items:center; gap:7px; }
.btn:disabled { opacity:.4; cursor:default; }
.btn-p { background:var(--p); color:#fff; }
.btn-p:hover { background:var(--p2); }
.btn-ghost { background:var(--p3); color:var(--p); }
.btn-ghost:hover { background:#d8d0fc; }
.btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }

.mic-btn { width:80px; height:80px; border-radius:50%; background:var(--p);
  border:none; cursor:pointer; display:grid; place-items:center;
  box-shadow:0 4px 18px rgba(67,24,209,.35); transition:.2s; margin:0 auto 12px; }
.mic-btn:hover { background:var(--p2); transform:scale(1.05); }
.mic-btn.listening { background:var(--red2); animation:pulse-mic 1.1s infinite; }
.mic-btn svg { width:32px; height:32px; fill:#fff; }
@keyframes pulse-mic {
  0%,100% { box-shadow:0 0 0 0 rgba(239,83,80,.45); }
  50%      { box-shadow:0 0 0 14px rgba(239,83,80,0); }
}
.mic-label { text-align:center; font-size:13px; color:var(--muted);
  font-weight:600; min-height:20px; margin-bottom:4px; }

.spoken-box { background:#f8f7ff; border:2px solid #e0d9ff; border-radius:10px;
  padding:10px 14px; font-size:15px; color:var(--text);
  min-height:42px; margin:10px 0; display:none; }
.spoken-box.visible { display:block; }

.word-feedback { background:#f8f7ff; border:2px solid #e0d9ff; border-radius:12px;
  padding:14px 16px; margin-top:12px; display:none; line-height:2; }
.word-feedback.visible { display:block; }
.wf-label { font-size:11px; font-weight:700; color:var(--muted);
  text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
.w { display:inline-block; padding:3px 8px; border-radius:6px;
  margin:2px 3px; font-size:15px; font-weight:600; }
.w-correct { background:var(--green3); color:var(--green); }
.w-wrong   { background:var(--red3);   color:var(--red); text-decoration:line-through; }
.w-missing { background:var(--orange3); color:var(--orange);
  border:1.5px dashed var(--orange); }

.score-row { display:flex; align-items:center; gap:14px; margin-top:14px; }
.score-track { flex:1; background:#e8e4ff; border-radius:20px; height:10px; }
.score-fill  { height:10px; border-radius:20px; transition:width .6s; }
.score-num   { font-size:22px; font-weight:800; min-width:52px; text-align:right; }

.result-banner { border-radius:12px; padding:13px 16px; margin-top:14px;
  display:none; align-items:center; gap:12px; }
.result-banner.visible { display:flex; }
.result-banner.pass { background:var(--green3); border:2px solid var(--green2); }
.result-banner.fail { background:var(--red3);   border:2px solid var(--red2); }
.result-banner .icon { font-size:26px; }
.result-banner h3 { font-size:16px; font-weight:700; margin-bottom:2px; }
.result-banner p  { font-size:13px; color:#555; }

.legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:14px;
  font-size:12px; color:var(--muted); }
.legend span { display:flex; align-items:center; gap:4px; }
.dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }

.done-screen { text-align:center; padding:10px 0; }
.done-screen h2 { font-size:28px; font-weight:800; color:var(--p); margin-bottom:8px; }
.done-screen p  { font-size:15px; color:var(--muted); margin-bottom:24px; }
</style>
</head>
<body>

<header>
  <div class="logo">E</div>
  <div><h1>EZRA</h1><p>Speech Practice Demo</p></div>
</header>

<div class="progress-wrap">
  <div class="progress-label" id="prog-label">-</div>
  <div class="progress-track">
    <div class="progress-fill" id="prog-fill" style="width:0%"></div>
  </div>
</div>

<div class="card" id="main-card">
  <div class="hebrew-label">Read in English:</div>
  <div class="hebrew-text" id="hebrew">Loading...</div>
  <div class="english-ref" id="english-ref" style="opacity:0"></div>

  <div class="btn-row">
    <button class="btn btn-p"     onclick="playSentence()">&#128266; Play</button>
    <button class="btn btn-ghost" onclick="revealEnglish()">&#128065; Show English</button>
  </div>

  <button class="mic-btn" id="mic-btn" onclick="startRecognition()">
    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3.03 2.93 5.37 5.91 5.82V20c0 .55.45 1 1 1s1-.45 1-1v-2.04c2.98-.45 5.42-2.79 5.91-5.82.1-.6-.39-1.14-1-1.14z"/></svg>
  </button>
  <div class="mic-label" id="mic-label">Tap to speak</div>

  <div class="spoken-box" id="spoken-box"></div>

  <div class="score-row" id="score-row" style="display:none">
    <div class="score-track">
      <div class="score-fill" id="score-fill" style="width:0%"></div>
    </div>
    <div class="score-num" id="score-num">-</div>
  </div>

  <div class="word-feedback" id="word-feedback">
    <div class="wf-label">Word-by-word feedback:</div>
    <div id="word-list"></div>
    <div class="legend">
      <span><div class="dot" style="background:#c8e6c9"></div> correct</span>
      <span><div class="dot" style="background:#ffcdd2"></div> wrong / missed</span>
      <span><div class="dot" style="background:#ffe0b2"></div> missing word</span>
    </div>
  </div>

  <div class="result-banner" id="result-banner">
    <div class="icon" id="result-icon"></div>
    <div>
      <h3 id="result-title"></h3>
      <p  id="result-sub"></p>
    </div>
  </div>
</div>

<div class="card" id="done-card" style="display:none"></div>

<script>
var currentQ = null;
var waiting  = false;

function showDoneScreen(q) {
  document.getElementById("main-card").style.display = "none";
  var done = document.getElementById("done-card");
  done.style.display = "block";

  var results  = q.results  || [];
  var passed   = q.passed   || 0;
  var total    = q.total    || results.length;
  var avgScore = q.avg_score || 0;

  var color = avgScore >= 85 ? "#4CAF50" : avgScore >= 60 ? "#FF9800" : "#ef5350";

  var rowsHtml = "";
  for (var i = 0; i < results.length; i++) {
    var r    = results[i];
    var sc   = r.score;
    var rc   = sc >= 85 ? "#4CAF50" : sc >= 60 ? "#FF9800" : "#ef5350";
    var icon = r.passed ? "&#10003;" : "&#10007;";
    var ibg  = r.passed ? "#e8f5e9"  : "#ffebee";
    var ifc  = r.passed ? "#2e7d32"  : "#c62828";
    rowsHtml +=
      '<div style="display:flex;align-items:center;gap:10px;padding:9px 13px;' +
      'border-radius:10px;background:#f8f7ff;border-left:5px solid ' + rc + ';margin-bottom:8px;">' +
      '<span style="font-size:18px;font-weight:800;color:' + ifc + ';background:' + ibg +
      ';width:28px;height:28px;border-radius:50%;display:grid;place-items:center;">' + icon + '</span>' +
      '<span style="flex:1;font-size:14px;color:#1a1033;">' + r.sentence + '</span>' +
      '<span style="font-size:12px;font-weight:700;color:#fff;background:' + rc +
      ';padding:3px 10px;border-radius:20px;">' + sc + '%</span>' +
      '</div>';
  }

  done.innerHTML =
    '<div style="text-align:center;padding:8px 0 20px">' +
      '<div style="font-size:48px;margin-bottom:10px">&#127881;</div>' +
      '<h2 style="font-size:26px;font-weight:800;color:#4318D1;margin-bottom:6px">Session Complete!</h2>' +
      '<p style="font-size:14px;color:#888;margin-bottom:20px">Here is how you did:</p>' +
      '<div style="display:flex;gap:12px;justify-content:center;margin-bottom:24px;flex-wrap:wrap">' +
        '<div style="background:#ede7ff;border-radius:14px;padding:14px 20px;min-width:90px">' +
          '<div style="font-size:30px;font-weight:800;color:#4318D1">' + passed + '/' + total + '</div>' +
          '<div style="font-size:11px;color:#888;font-weight:600;text-transform:uppercase;margin-top:2px">Passed</div>' +
        '</div>' +
        '<div style="background:#ede7ff;border-radius:14px;padding:14px 20px;min-width:90px">' +
          '<div style="font-size:30px;font-weight:800;color:' + color + '">' + avgScore + '%</div>' +
          '<div style="font-size:11px;color:#888;font-weight:600;text-transform:uppercase;margin-top:2px">Avg Score</div>' +
        '</div>' +
        '<div style="background:#ede7ff;border-radius:14px;padding:14px 20px;min-width:90px">' +
          '<div style="font-size:30px;font-weight:800;color:#4318D1">' +
            Math.round((passed / Math.max(total,1)) * 100) + '%</div>' +
          '<div style="font-size:11px;color:#888;font-weight:600;text-transform:uppercase;margin-top:2px">Accuracy</div>' +
        '</div>' +
      '</div>' +
      '<div style="text-align:left;margin-bottom:20px">' + rowsHtml + '</div>' +
      '<button class="btn btn-p" style="width:100%;padding:13px;font-size:16px" ' +
        'onclick="resetSession()">&#128260; Start Again</button>' +
    '</div>';
}

function loadQuestion() {
  resetUI();
  fetch("/question")
    .then(function(r) { return r.json(); })
    .then(function(q) {
      if (q.done) {
        showDoneScreen(q);
        return;
      }
      currentQ = q;
      document.getElementById("hebrew").textContent      = q.he;
      document.getElementById("english-ref").textContent = q.en;
      document.getElementById("prog-label").textContent  =
        "Sentence " + (q.index + 1) + " of " + q.total;
      document.getElementById("prog-fill").style.width =
        Math.round((q.index / q.total) * 100) + "%";
      setTimeout(playSentence, 400);
    })
    .catch(function(err) {
      document.getElementById("hebrew").textContent = "Error: " + err.message;
    });
}

function playSentence() {
  if (!currentQ) return;
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(currentQ.en);
  u.lang = "en-US";
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

function revealEnglish() {
  var el = document.getElementById("english-ref");
  el.style.opacity = el.style.opacity === "1" ? "0" : "1";
}

function startRecognition() {
  if (waiting) return;
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert("Speech Recognition not supported. Please use Chrome or Edge.");
    return;
  }
  var rec      = new SR();
  var micBtn   = document.getElementById("mic-btn");
  var micLabel = document.getElementById("mic-label");

  rec.lang = "en-US";
  rec.interimResults = false;

  micBtn.classList.add("listening");
  micLabel.textContent = "Listening...";

  rec.onresult = function(event) {
    var text = event.results[0][0].transcript;
    micBtn.classList.remove("listening");
    micLabel.textContent = "Processing...";

    var spokenBox = document.getElementById("spoken-box");
    spokenBox.textContent = "You said: " + text;
    spokenBox.classList.add("visible");

    fetch("/answer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answer: text })
    })
    .then(function(r) { return r.json(); })
    .then(function(result) { showResult(result); })
    .catch(function(err) { micLabel.textContent = "Error - try again"; });
  };

  rec.onerror = function(e) {
    micBtn.classList.remove("listening");
    micLabel.textContent = "Error - try again";
  };

  rec.onend = function() {
    micBtn.classList.remove("listening");
    if (micLabel.textContent === "Listening...")
      micLabel.textContent = "Tap to speak";
  };

  rec.start();
}

function showResult(result) {
  var passed = result.passed;
  var score  = result.score;

  var scoreRow  = document.getElementById("score-row");
  var scoreFill = document.getElementById("score-fill");
  var scoreNum  = document.getElementById("score-num");
  scoreRow.style.display = "flex";
  var color = score >= 85 ? "#4CAF50" : score >= 60 ? "#FF9800" : "#ef5350";
  scoreFill.style.background = color;
  scoreFill.style.width  = score + "%";
  scoreNum.textContent   = score + "%";
  scoreNum.style.color   = color;

  var wfEl = document.getElementById("word-feedback");
  var wlEl = document.getElementById("word-list");
  wfEl.classList.add("visible");
  var html = "";
  for (var i = 0; i < result.words.length; i++) {
    var w   = result.words[i];
    var cls = w.status === "correct" ? "w-correct"
            : w.status === "wrong"   ? "w-wrong"
            :                          "w-missing";
    html += '<span class="w ' + cls + '">' + w.word + '</span> ';
  }
  wlEl.innerHTML = html;

  var banner = document.getElementById("result-banner");
  var icon   = document.getElementById("result-icon");
  var title  = document.getElementById("result-title");
  var sub    = document.getElementById("result-sub");

  banner.className  = "result-banner visible " + (passed ? "pass" : "fail");
  icon.textContent  = passed ? "OK" : "X";
  title.textContent = passed ? "Great job!" : score >= 60 ? "Close! Try again." : "Try again.";
  sub.textContent   = passed
    ? "Score: " + score + "% - moving to next sentence..."
    : "Score: " + score + "% - you need " + result.threshold + "% to pass.";

  document.getElementById("mic-label").textContent = passed ? "Moving on..." : "Tap to try again";

  if (passed) {
    waiting = true;
    document.getElementById("english-ref").style.opacity = "1";
    setTimeout(function() { waiting = false; loadQuestion(); }, 2000);
  }
}

function resetUI() {
  var sb = document.getElementById("spoken-box");
  sb.classList.remove("visible");
  sb.textContent = "";
  var wf = document.getElementById("word-feedback");
  wf.classList.remove("visible");
  document.getElementById("word-list").innerHTML = "";
  document.getElementById("score-row").style.display = "none";
  document.getElementById("score-fill").style.width = "0%";
  document.getElementById("score-num").textContent = "-";
  document.getElementById("result-banner").className = "result-banner";
  document.getElementById("english-ref").style.opacity = "0";
  document.getElementById("mic-label").textContent = "Tap to speak";
  document.getElementById("mic-btn").classList.remove("listening");
}

function resetSession() {
  fetch("/reset", { method: "POST" })
    .then(function() {
      document.getElementById("main-card").style.display = "block";
      document.getElementById("done-card").style.display = "none";
      loadQuestion();
    });
}

loadQuestion();
</script>
</body>
</html>
